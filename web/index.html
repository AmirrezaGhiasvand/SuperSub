<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuperSub</title><style>
:root{color-scheme:dark;--bg:#070707;--panel:#111;--text:#fafafa;--line:#303030}body.light{color-scheme:light;--bg:#f6f6f6;--panel:white;--text:#111;--line:#ddd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui}header{display:flex;align-items:center;gap:18px;padding:24px 4%;border-bottom:1px solid var(--line)}header img{width:48px}h1{margin:0;font-size:26px}small,label{color:#999}header button{margin-left:auto}main{padding:32px 4%;display:grid;grid-template-columns:300px 1fr;gap:24px}section,aside{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:24px}h2{font-size:20px}label{display:block;margin-top:20px}input,select,textarea,button{font:inherit;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);color:var(--text)}input,select,textarea{width:100%;margin-top:8px}button{cursor:pointer}button:hover{border-color:var(--text)}.primary{background:var(--text);color:var(--bg);width:100%;margin-top:20px;border-radius:30px;font-weight:700}video{width:100%;max-height:380px;background:black;border-radius:16px}.cue{display:grid;grid-template-columns:90px 90px 1fr 40px;gap:8px;margin-top:12px}.cue.active{outline:1px solid var(--text);border-radius:12px}.cue textarea{direction:rtl}#history button{display:block;width:100%;margin-top:10px;text-align:left}#message{white-space:pre-wrap;padding:16px 0}a{color:inherit}progress{width:100%}@media(max-width:800px){main{grid-template-columns:1fr}.cue{grid-template-columns:70px 70px 1fr 40px}}
</style><header><img src="/assets/mansvolve-white.png" id="logo" alt="Mansvolve" onerror="this.hidden=true"><div><h1>SuperSub</h1><small>LOCAL AUDIO. CLEAR SUBTITLES.</small></div><button id="theme">Toggle theme</button></header><main><aside><h2>Make every word count.</h2><label>Video file<input type="file" id="file" accept="video/*,audio/*"></label><label>Model<select id="model"></select></label><label>Video language<select id="language"><option value="fa">Persian</option><option value="">Auto detect</option><option value="en">English</option><option value="ar">Arabic</option><option value="tr">Turkish</option><option value="de">German</option><option value="fr">French</option></select></label><label>Maximum words per cue<input id="limit" type="number" min="1" max="30" value="8"></label><label>Glossary hints<textarea id="glossary" placeholder="Names, brands, technical terms"></textarea></label><button class="primary" id="generate">Generate subtitles</button><p><button id="cancel">Cancel</button></p><small>CPU INT8 · Private, local processing</small><h2>Projects</h2><div id="history"></div></aside><section><h2 id="title">Your subtitle studio</h2><video id="video" controls></video><div id="message">Select a video to get started.</div><progress id="progress" value="0" max="100"></progress><p><button id="save">Save edits</button> <button id="reflow">Reflow</button> <button id="add">Add cue</button> <a id="download" hidden>Download SRT</a> <button id="remove">Delete project</button></p><div id="cues"></div></section></main><script>
const $=id=>document.getElementById(id);let current=null,timer;
async function api(path,method='GET',body){const r=await fetch('/api/'+path,{method,body:body instanceof FormData?body:body?JSON.stringify(body):undefined,headers:body&&!(body instanceof FormData)?{'Content-Type':'application/json'}:{}});if(!r.ok){let e=await r.json();throw Error(e.detail||r.statusText)}return r.json()}
function message(e){$('message').textContent=e.message||e}function safe(fn){return async()=>{try{await fn()}catch(e){message(e)}}}function settings(){return {model:$('model').value,language:$('language').value,limit:Number($('limit').value),glossary:$('glossary').value}}
async function history(){let all=await api('projects');$('history').replaceChildren();for(const p of all){let b=document.createElement('button');b.textContent=p.name;b.onclick=()=>open(p);$('history').append(b)}}
function open(p){current=p;$('title').textContent=p.name;$('video').src='/api/projects/'+p.id+'/media';$('download').href='/api/projects/'+p.id+'/srt';$('download').hidden=false;render()}
function render(){$('cues').replaceChildren();for(const [i,c] of current.cues.entries()){let row=document.createElement('div');row.className='cue';for(const key of ['start','end','text']){let el=document.createElement(key==='text'?'textarea':'input');el.value=c[key];el.setAttribute('aria-label',key+' cue '+(i+1));if(key!=='text'){el.type='number';el.step='.001';el.min=0}el.oninput=()=>c[key]=key==='text'?el.value:Number(el.value);row.append(el)}let b=document.createElement('button');b.textContent='×';b.onclick=()=>{current.cues.splice(i,1);render()};row.append(b);row.ondblclick=()=>$('video').currentTime=c.start;$('cues').append(row)}}
$('generate').onclick=safe(async()=>{if($('file').files[0]){let f=new FormData();f.append('file',$('file').files[0]);open(await api('projects','POST',f));$('file').value='';await history()}if(!current)throw Error('Select a video first');await api('projects/'+current.id+'/run','POST',settings());message('Transcribing…');clearInterval(timer);timer=setInterval(safe(async()=>{let s=await api('projects/'+current.id+'/status');$('progress').value=s.progress||0;message(s.error||s.status);if(s.status!=='running'){clearInterval(timer);let all=await api('projects');open(all.find(p=>p.id===current.id))}}),1000)});
$('save').onclick=safe(async()=>{if(current){current=await api('projects/'+current.id+'/cues','PUT',current.cues);message('Saved')}});$('reflow').onclick=safe(async()=>{if(current){current=await api('projects/'+current.id+'/reflow','POST',settings());render()}});$('cancel').onclick=safe(async()=>{if(current)await api('projects/'+current.id+'/cancel','POST')});$('add').onclick=()=>{if(current){let end=current.cues.at(-1)?.end||0;current.cues.push({start:end,end:end+2,text:''});render()}};$('remove').onclick=safe(async()=>{if(current&&confirm('Delete this project and its local media?')){await api('projects/'+current.id,'DELETE');location.reload()}});$('video').ontimeupdate=()=>{if(current)[...$('cues').children].forEach((r,i)=>r.classList.toggle('active',current.cues[i].start<=$('video').currentTime&&current.cues[i].end>$('video').currentTime))};function theme(){document.body.classList.toggle('light',localStorage.theme==='light');$('logo').src='/assets/mansvolve-'+(localStorage.theme==='light'?'black':'white')+'.png'}$('theme').onclick=()=>{localStorage.theme=localStorage.theme==='light'?'dark':'light';theme()};theme();api('models').then(ms=>{for(const m of ms){let o=new Option(m.name+(m.ready?'':' (not installed)'),m.id);$('model').add(o)}});history().catch(message);
</script></html>
